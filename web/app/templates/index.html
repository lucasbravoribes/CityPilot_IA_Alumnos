{% extends "base.html" %}

{% block content %}
<h1>Planificador CityPilot</h1>
<form action="/planificar" method="POST">
    <label for="ciudad">Ciudad:</label>
    <input type="text" id="ciudad" name="ciudad" required placeholder="Ej: Valencia">

    <label for="tipo">Tipo de turismo:</label>
    <select id="tipo" name="tipo" required>
        <option value="cultural">Cultural</option>
        <option value="gastronomico">Gastronómico</option>
        <option value="naturaleza">Naturaleza</option>
        <option value="familiar">Familiar</option>
    </select>

    <label for="duracion">Duración (horas):</label>
    <select id="duracion" name="duracion" required>
        <option value="2">2 horas</option>
        <option value="4">4 horas</option>
        <option value="6">6 horas</option>
    </select>

    <label for="preferencias">Preferencias (opcional):</label>
    <input type="text" id="preferencias" name="preferencias" placeholder="Ej: evitar caminar mucho, con niños">

    <button type="submit">Generar Ruta</button>
</form>

{% if error %}
    <p style="color: red;">Error: {{ error }}</p>
{% endif %}
{% endblock %}
